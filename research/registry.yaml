- id: '003'
  created: '2026-07-05'
  hypothesis: STRONG_BUY-gated entries (MED/HIGH confidence) beat SPY TR net of costs
    over a 52-week window, per the pre-declared OBSERVATION_PROTOCOL §5 success gate.
  mechanism: A causal-reasoning rating engine emits ratings with a pre-logged falsifiable
    invalidation line; the tested claim is that its STRONG_BUY gate carries information
    vs SPY TR. Per §3 power reality a 52-week window CANNOT establish alpha != 0 (realistic
    skill alpha ~1-4%/yr sits below the ~8-16% ann. detection floor); it establishes
    process integrity, cost realism, and a ~30-60-trade calibration sample. No counterparty
    edge is asserted beyond the engine's rating skill.
  universe: ~20-stock equal-weight book from the locked universe (config/universe.yaml),
    benchmarked vs SPY TR
  window: 52 weeks (1 year)
  metric: TWR vs SPY TR (dividends included); Information Ratio; hit-rate of closed
    trades (alpha vs SPY); PT-calibration Spearman (implied-upside decile vs realized)
  threshold: 'SUCCESS (all at window end >=52wk): IR >= 0.5; Max-DD ratio <= 1.2;
    PT calibration Spearman >= 0.30; Hit-rate >= 50% over >=30 closed trades; zero
    process violations'
