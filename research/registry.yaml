- id: '002'
  created: '2026-07-05'
  hypothesis: 'Post-earnings-announcement drift: large positive earnings surprises
    are followed by positive net-of-cost excess return over the drift window in the
    traded universe.'
  mechanism: Slow information diffusion and analyst anchoring leave surprises under-priced
    at the event; the counterparty is the under-reactor. In liquid large caps the
    drift is largely arbitraged away, so net-of-cost edge is thin.
  universe: US equities with scheduled earnings events (swing-bot universe)
  window: event-driven backtest
  metric: mean net-of-cost excess return over the drift window vs benchmark
  threshold: positive net excess clearing the significance bar
