- id: '001'
  created: '2026-07-05'
  hypothesis: '12-1 month cross-sectional momentum predicts forward excess return
    in large-cap US equities: Q1-Q5 monthly net spread > 0 with Newey-West t >= 2.0.'
  mechanism: Underreaction to persistent fundamental trends by attention-constrained
    investors; the counterparty is a disposition-prone holder who sells winners early
    and holds losers. The edge erodes as the trade crowds and as turnover costs bite.
  universe: large-cap US equities (config/universe.yaml)
  window: monthly rebalance, 2018-2024 backtest
  metric: Q1-Q5 monthly net-of-cost spread; Newey-West HAC t-stat (lag 6)
  threshold: net spread > 0 AND t >= 2.0
