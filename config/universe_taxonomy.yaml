# ATS Universe Taxonomy — Economic Behavior Archetype Registry
# Classifies universe tickers by economic behavior, NOT GICS sector.
#
# Two companies in different sectors may behave identically.
# AMAT and GNRC both behave as AI-capex cyclicals.
# SPGI and CME both behave as financial infrastructure compounders.
# DUK and SO both behave as regulated defensive utilities.
#
# Version: 1.0  Effective: 2026-05-26
# HUMAN-EDITABLE — update as business models evolve.
#
# Tickers marked [EXPANSION] are not in the current universe but represent
# key archetype gaps — they are valid candidates for universe admission.

version: "1.0"
effective_date: "2026-05-26"

# ─── Universe-level hard limits ───────────────────────────────────────────────
limits:
  max_archetype_fraction: 0.20        # >20% in one archetype → OVERREPRESENTED
  max_cyclical_fraction: 0.30         # >30% cyclical heavy → CONCENTRATED warning
  max_policy_fraction: 0.20           # >20% policy sensitive → warning
  max_leverage_fraction: 0.15         # >15% leverage sensitive → warning
  max_macro_dependency: 0.25          # >25% single macro dependency → warning
  min_defensive_fraction: 0.15        # <15% defensive archetypes → GAP alert
  min_recession_resilient_fraction: 0.10  # <10% recession_resilient → GAP alert
  overrepresented_threshold: 0.25     # flag archetype above this fraction

# ─── Archetype definitions ────────────────────────────────────────────────────
# cyclicality: 0.0 = immune to cycles, 1.0 = highly cyclical
# defensiveness: 0.0 = no recession defense, 1.0 = maximum defense
# Each score informs per-ticker characteristic derivation.

