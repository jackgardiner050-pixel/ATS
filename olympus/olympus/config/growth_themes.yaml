# Olympus v2 — observed live high-growth themes + value chains + catalysts.
# RESEARCH-GRADE / OBSERVATIONAL. This is the human-curated view the observational feed refreshes
# (it logs theme-calls + writes PROPOSALS, never auto-edits this file). Roles are authoritative:
#   leader     = the obvious primary name in the theme
#   bottleneck = the second-order enabler at scale or with new enabling tech (power, cooling,
#                packaging, fabs, launch, materials, memory, optics, fuel)
# stage (Chronos): early_accelerating | mid | late_frothy   (arms avoid buying a frothy top)
# Private companies are NEVER listed as tickers — they appear only as catalysts whose PUBLIC
# beneficiaries (holders / suppliers / partners) are surfaced for awareness.

themes:
  ai_compute:
    label: "AI training/inference compute"
    stage: mid
    leaders: [NVDA, AMD]
    bottlenecks:
      - {ticker: TSM,  enabler: "leading-edge foundry capacity"}
      - {ticker: AMKR, enabler: "advanced packaging (CoWoS/OSAT)"}
      - {ticker: MU,   enabler: "HBM high-bandwidth memory"}
      - {ticker: ANET, enabler: "datacenter switching / networking"}
      - {ticker: COHR, enabler: "optical interconnect / lasers"}
    catalysts: []

  ai_power_grid:
    label: "datacenter power & grid bottleneck"
    stage: early_accelerating
    leaders: [GEV, ETN]
    bottlenecks:
      - {ticker: VRT,  enabler: "rack power & liquid cooling"}
      - {ticker: POWL, enabler: "electrical distribution equipment"}
      - {ticker: PWR,  enabler: "grid / transmission construction"}
      - {ticker: VST,  enabler: "merchant power generation for datacenters"}
      - {ticker: CEG,  enabler: "nuclear baseload for datacenters"}
    catalysts:
      - {name: "Hyperscaler datacenter capex buildout", type: capex, public_beneficiaries: [VRT, GEV, VST]}

  datacenter_cooling:
    label: "datacenter thermal management"
    stage: early_accelerating
    leaders: [VRT]
    bottlenecks:
      - {ticker: MOD,  enabler: "liquid-cooling heat exchangers"}
      - {ticker: AAON, enabler: "precision data-center HVAC"}
    catalysts: []

  advanced_packaging:
    label: "advanced semiconductor packaging & metrology"
    stage: mid
    leaders: [TSM]
    bottlenecks:
      - {ticker: AMKR, enabler: "OSAT advanced packaging"}
      - {ticker: ONTO, enabler: "packaging metrology/inspection"}
      - {ticker: FORM, enabler: "advanced probe cards"}
      - {ticker: COHR, enabler: "photonics for co-packaged optics"}
    catalysts:
      - {name: "CHIPS Act US fab funding", type: gov_funding, public_beneficiaries: [INTC, TSM, AMAT]}

  obesity_glp1:
    label: "GLP-1 / obesity drugs"
    stage: mid
    leaders: [LLY, NVO]
    bottlenecks:
      - {ticker: WST, enabler: "drug-delivery / injectable containment components"}
    catalysts: []

  space_launch:
    label: "commercial space & launch"
    stage: early_accelerating
    leaders: [RKLB]
    bottlenecks:
      - {ticker: ASTS, enabler: "direct-to-cell satellite constellation"}
    catalysts:
      - {name: "SpaceX Starship/Starlink cadence (PRIVATE company)", type: private_company,
         private_company: SpaceX, public_beneficiaries: [GOOGL],
         note: "SpaceX is PRIVATE — not tradeable; GOOGL holds a stake. Surface the holder, never the IPO."}

  nuclear_power:
    label: "nuclear / SMR power for AI load"
    stage: early_accelerating
    leaders: [CEG, VST]
    bottlenecks:
      - {ticker: CCJ,  enabler: "uranium fuel supply"}
      - {ticker: GEV,  enabler: "reactor / SMR technology"}
    catalysts: []

  cybersecurity:
    label: "AI-era cybersecurity"
    stage: mid
    leaders: [CRWD, PANW]
    bottlenecks:
      - {ticker: ZS, enabler: "zero-trust network access"}
    catalysts: []

  quantum_compute:
    label: "quantum computing"
    stage: late_frothy
    leaders: [IONQ, RGTI]
    bottlenecks: []
    catalysts: []

# catalysts not tied to a single theme — IPO / funding / launch beneficiaries (awareness only)
global_catalysts:
  - name: "Anthropic IPO (anticipated)"
    type: ipo
    private_company: Anthropic
    public_beneficiaries: [AMZN, GOOGL]
    note: "Anthropic is PRIVATE — never 'buy the IPO'. AMZN & GOOGL hold stakes; surface the holders."
  - name: "OpenAI funding round"
    type: funding
    private_company: OpenAI
    public_beneficiaries: [MSFT]
    note: "OpenAI is private; MSFT is the public partner/holder."
