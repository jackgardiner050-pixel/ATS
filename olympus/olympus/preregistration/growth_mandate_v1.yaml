ruleset: growth_mandate_v1
title: "Olympus v2 — growth-discovery mandate (reorientation + 3 arms + harvest/exit discipline)"
status: PREREGISTERED
preregistered_on: "2026-06-04"
final: true   # FINAL — committed before the runs. Editing breaks the hash (fail-closed).

# ── 1. reorientation to growth ────────────────────────────────────────────────
reorientation:
  non_consensus_required: false      # consensus leaders are FINE — drop the v1 non-consensus gate
  conviction_drivers:                # what conviction is now built from
    - durable_or_accelerating_growth
    - quality                        # margins / returns on capital / balance sheet
    - momentum                       # price/earnings trend confirms, not contradicts
    - bottleneck_angle               # second-order enabler at scale / new enabling tech
  durability_check:                  # REPLACES the priced-in veto (the real growth risk)
    question: "is the growth REAL and DURABLE, or hype / peaking?"
    states: [durable, peaking, hype]
    # durable → conviction stands; peaking/hype → down-weight to research (no buy)
  priced_in_veto: REMOVED            # being at/above consensus target no longer vetoes a growth buy

# ── 2. benchmark ──────────────────────────────────────────────────────────────
benchmark:
  primary_etf: QQQ                   # the growth/tech basket — "does picking beat the growth basket?"
  secondary_broad: ACWI              # broad index kept as a second yardstick only
  question: "does each arm's stock-picking beat just buying QQQ?"

# ── 3. the three arms (same pipeline, different discovery filter, own book) ────
arms:
  A: { label: "obvious theme leaders only",            allowed_roles: [leader] }
  B: { label: "leaders + second-order bottlenecks",    allowed_roles: [leader, bottleneck] }
  C: { label: "second-order bottleneck names only",    allowed_roles: [bottleneck] }
  scored: "each independently vs QQQ and vs each other — learn which edge-focus wins"

# ── 4. discipline (what makes it survivable) ──────────────────────────────────
harvest_into_core:                   # ride → harvest → compound
  run_hard_gain_pct: 40              # a winner up >= +40% from cost is 'run hard' → harvest
  harvest_fraction: 0.33             # trim a third on a run-hard / band-drift trigger
  band_drift_trim: true              # also trim back any single name that drifts past max_single
  bank_destination: core             # proceeds banked into the safe passive core

exit_thesis_break:                   # tight exit — HYBRID (pre-registered; tune HERE, not in code)
  profit_take_pct: 60                # lock gains: trim again once up >= +60%
  profit_take_fraction: 0.5
  momentum_break_drawdown_pct: 20    # sell if it falls >= 20% from its post-entry high (momentum rolled over)
  thesis_break_on: [growth_decelerates, durability_flips_to_peaking_or_hype]
  action_on_thesis_break: EXIT       # full exit on a broken growth thesis

sizing:
  max_initial: 0.03                  # mirror constants — no all-in-one-name
  max_single: 0.05
  max_theme: 0.40
  concentration_check_vs_real_core: true   # Hecate checks overlap with the user's real core

# ── 5. cost & governance ──────────────────────────────────────────────────────
governance:
  candidates_cap_per_run: 8          # bound cost + noise per arm
  cheap_triage_then_deep_thesis: true
  log_cost_per_run: true
  fail_loud_on_missing_data: true
  paper_simulated_only: true         # tagged paper/simulated; human pulls any live trigger
  oracle_ledger: "not written by the growth path — preserved byte-identical"

lock:
  version: v1
  note: >
    Pre-registered and hash-locked. Tune thresholds by issuing a NEW versioned pre-registration,
    never by editing this file — any edit breaks its sha256 and fails closed.
